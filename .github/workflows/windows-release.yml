name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-gui.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-gui.lock.txt

      - name: Run regression suite
        run: python -m unittest discover -s tests -q

      - name: Build Windows application
        shell: pwsh
        run: .\build_gui.ps1 -PythonExe (Get-Command python).Source

      - name: Package complete application folder
        shell: pwsh
        run: |
          $archive = "AudioFischerOptimizer-windows-x64.zip"
          Compress-Archive -Path .\dist\AudioFischerOptimizer\* -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioFischerOptimizer-windows-x64
          path: |
            AudioFischerOptimizer-windows-x64.zip
            AudioFischerOptimizer-windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            AudioFischerOptimizer-windows-x64.zip `
            AudioFischerOptimizer-windows-x64.zip.sha256 `
            --title "AudioFischer Optimizer ${{ github.ref_name }}" `
            --generate-notes
